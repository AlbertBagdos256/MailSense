<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MailSense Dashboard</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <div class="header-content">
                <h1>Analytics</h1>
                <button id="refresh-btn" class="refresh-btn">🔄 Refresh</button>
            </div>
        </header>

        <div class="stats-section">
            <div class="stat-card">
                <div class="stat-label">Total Emails</div>
                <div class="stat-value" id="total-emails">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Categories</div>
                <div class="stat-value" id="total-categories">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Date Range</div>
                <div class="stat-value" id="date-range">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Spam Emails</div>
                <div class="stat-value" id="spam-count">0</div>
            </div>
        </div>

        <div class="charts-section">
            <div class="chart-container">
                <h2>Email Distribution by Category</h2>
                <div id="category-chart"></div>
            </div>

            <div class="chart-container">
                <h2>Email Volume Over Time</h2>
                <div id="monthly-chart"></div>
            </div>
        </div>

        <div id="error-message" class="error-message"></div>
    </div>

    <script src="mockData.js"></script>
    <script src="fetchEmails.js"></script>
    <script src="categoryChart.js"></script>
    <script src="monthlyChart.js"></script>
    <script src="main.js"></script>
</body>
</html>
